source = ~/.config/hypr/conf/mouseKey.conf
source = ~/.config/hypr/conf/keybinding.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/layout.conf

# Default monitor rule — laptop panel. scripts/hdmi.sh (autostarted) listens
# to Hyprland's native monitor hotplug events and switches to external-only
# when the Philips monitor is connected, then back to laptop-only on unplug.
#
# `auto` positioning lets Hyprland arrange outputs side-by-side without
# overlap — this avoids the "overlapping monitors" warning during the brief
# window where both panels are enabled mid-switch.
monitor = eDP-1, preferred, auto, 1
# Pin the HDMI/TV to 2560x1440@60. The Radeon 740M (DCN 3.1.4) cannot reliably
# drive it at native 4K@60 (display-bandwidth/compbuf failures -> lag), so we
# must NOT let the catch-all 'preferred' rule pick 4K on a config reload.
monitor = HDMI-A-1, 2560x1440@60, auto, 1
# Catch-all fallback so any unknown/new output is auto-placed (never overlaps).
monitor = , preferred, auto, 1

misc {
    disable_splash_rendering = true
    initial_workspace_tracking = 1 
    focus_on_activate = true
    disable_hyprland_logo = true
    force_default_wallpaper = 0    # kills the "Hyprland is so good..." quote overlay
    background_color = 0x282828    # Gruvbox Dark base
}