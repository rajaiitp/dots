# Hyprlock Configuration - Fully Commented with Clean Spacing and Clarity
# File Path: ~/.config/hypr/hyprlock.conf


##########################
### GENERAL SETTINGS   ###
##########################
general {
    hide_cursor = true
}


##########################
### BACKGROUND IMAGE   ###
##########################
background {
    monitor =
    path = screenshot                     # 'screenshot' = auto-capture screen and blur it
    blur_passes = 3
    blur_size = 4
    noise = 0.0
    contrast = 0.7
    brightness = 0.8172
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}


################################
### USER AVATAR IMAGE (ICON) ###
################################



##########################
### PASSWORD FIELD     ###
##########################
input-field {
    monitor =
    size = 300, 45
    outline_thickness = 1
    dots_size = 0.1
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1
    # Catppuccin Mocha: mauve outline, base fill, text foreground
    outer_color = rgba(203, 166, 247, 0.5)
    inner_color = rgba(30, 30, 46, 0.6)
    font_color = rgba(205, 214, 244, 0.9)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##a6adc8">Enter Password</span>
    hide_input = false
    rounding = 0
    check_color = rgba(249, 226, 175, 0)
    fail_color = rgba(243, 139, 168, 0)
    fail_text = <span foreground="##f38ba8">Authentication Failed</span>

    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -180
    halign = center
    valign = center
}





##########################
### DAY OF THE WEEK    ###
##########################
label {
    monitor =
    text = cmd[update:86400000] /bin/zsh -c 'date +"%A"'
    color = rgba(203, 166, 247, 0.55)  # mauve
    font_size = 84
    font_family = Stange, sans-serif
    position = 0, 270
    halign = center
    valign = center
}


#############################################
### DATE DISPLAY (e.g. 2  A u g u s t ...) ###
#############################################
label {
    monitor =
    text = cmd[update:60000] /bin/zsh -c 'date +"%-d %B, %Y" | sed "s/./& /g" | sed "s/ $//"'
    color = rgba(205, 214, 244, 0.75)  # text
    font_size = 20
    font_family = SF Pro Display, sans-serif
    position = 0, 170
    halign = center
    valign = center
}


##########################
### TIME DISPLAY       ###
##########################
label {
    monitor =
    text = cmd[update:1000] /bin/zsh -c 'date +"- %-I:%M %p -" | sed "s/./& /g" | sed "s/ $//"'
    color = rgba(235, 160, 172, 0.9)  # maroon
    font_size = 16
    font_family = SF Pro Display, sans-serif
    position = 0, 110
    halign = center
    valign = center
}


