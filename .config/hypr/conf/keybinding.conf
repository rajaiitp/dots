# ----------------------------------------------------- 
# Key bindings
# name: "Default"
# ----------------------------------------------------- 

binds {
allow_workspace_cycles = true
}

# Apps
# Launch Herdr inside a plain WezTerm outer terminal. Herdr owns all
# workspace, tab, pane, and persistence behavior.
bind = SUPER, RETURN, exec, /home/raja/.local/bin/wezterm start -- herdr
bind = SUPER SHIFT, RETURN, exec, /home/raja/.local/bin/wezterm start --always-new-process -- herdr
bind = SUPER, D, exec, fuzzel
bind = SUPER, E, exec, pcmanfm
bind = SUPER SHIFT, B, exec, google-chrome-stable
# Global Tuxedo notes-tab toggle; this works across WezTerm, Kitty, and Herdr.
bind = CTRL, N, exec, ~/.config/herdr/scripts/toggle-tuxedo-tab.sh

# Tools
bind = SUPER, P, exec, hyprpicker | wl-copy
bind = SUPER SHIFT, V, exec, pavucontrol
bind = SUPER, A, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, A, exec, ~/.config/hypr/scripts/screenshot-annotate.sh
bind = SUPER, C, sendkeystate, Ctrl, C
bind = SUPER, V, sendkeystate, Ctrl, V

# Window management
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER, SPACE, fullscreen, 0
# Fake fullscreen: tell the app it's fullscreen (video fills its window) while the
# window stays tiled. Use on a video window instead of the app's fullscreen button.
bind = SUPER SHIFT, F, fullscreenstate, 0 2
bind = SUPER SHIFT, SPACE, togglefloating
bind = SUPER SHIFT, X, exec, hyprctl kill

# Theme / System
bind = SUPER SHIFT, Q, exec, pidof hyprlock || hyprlock
bind = SUPER CTRL, T, exec, ~/dotfiles/.config/hypr/scripts/toggle-theme.sh
bind = SUPER SHIFT, S, exec, systemctl suspend
bind = SUPER SHIFT, R, exec, ~/.config/hypr/scripts/reload.sh

# Brightness
bind = , xf86monbrightnessup, exec, ~/.config/scripts/display/brightness.sh up
bind = , xf86monbrightnessdown, exec, ~/.config/scripts/display/brightness.sh down

# Volume
bindel = , xf86audioraisevolume, exec, $HOME/.config/scripts/audio/volume_osd.sh up
bindel = , xf86audiolowervolume, exec, $HOME/.config/scripts/audio/volume_osd.sh down
bindl  = , xf86audiomute, exec, $HOME/.config/scripts/audio/volume_osd.sh mute

# Focus
bind = SUPER, TAB, workspace, previous
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Resize
bind = SUPER SHIFT, H, resizeactive, -100 0
bind = SUPER SHIFT, L, resizeactive, 100 0
bind = SUPER SHIFT, K, resizeactive, 0 -100
bind = SUPER SHIFT, J, resizeactive, 0 100

# Mouse
bindm = SHIFT, mouse:272, movewindow
bindm = SUPER, mouse:272, resizewindow

# Workspaces
bind = SUPER, 1, focusworkspaceoncurrentmonitor, 1
bind = SUPER, 2, focusworkspaceoncurrentmonitor, 2
bind = SUPER, 3, focusworkspaceoncurrentmonitor, 3
bind = SUPER, 4, focusworkspaceoncurrentmonitor, 4
bind = SUPER, 5, focusworkspaceoncurrentmonitor, 5
bind = SUPER, 6, focusworkspaceoncurrentmonitor, 6
bind = SUPER, 7, focusworkspaceoncurrentmonitor, 7
bind = SUPER, 8, focusworkspaceoncurrentmonitor, 8

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
