env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
# Include Flatpak app exports so launchers (fuzzel) find Flatpak .desktop files.
env = XDG_DATA_DIRS,/home/raja/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

exec-once = dunst
exec-once = wl-clip-persist --clipboard regular
exec-once = /usr/lib/xdg-desktop-portal-gtk
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = nm-applet
exec-once = hyprpaper
# hyprpaper 0.8.4 doesn't auto-apply hyprpaper.conf; apply via IPC after it starts
exec-once = /home/raja/.config/hypr/scripts/set-wallpaper.sh
exec-once = "/home/raja/.config/hypr/scripts/battery_alert.sh"
exec-once = "/home/raja/.config/hypr/scripts/charger_sound.sh"
# External-monitor manager: listens to Hyprland monitor hotplug events and
# switches to external-only when the Philips is connected, laptop-only on unplug.
exec-once = /home/raja/.config/hypr/scripts/hdmi.sh

exec = gsettings set org.gnome.desktop.interface icon-theme "Pop"
exec = gsettings set org.gnome.desktop.interface gtk-theme "Pop-dark"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

exec = /usr/bin/dbus-update-activation-environment --all
exec = pgrep waybar || waybar
# Blue-light filter. gammastep can't apply gamma while Hyprland color
# management (render:cm_enabled) is on. hyprsunset uses Hyprland's native CTM
# protocol instead.
#
# hyprsunset runs with NO time profiles (just the daemon). The supervised
# hyprsunset-ramp.service drives temperature smoothly via
# `hyprctl hyprsunset temperature`, interpolating day<->night across a window
# centred on the real local sunrise/sunset.
exec = pgrep hyprsunset || hyprsunset &
exec = systemctl --user import-environment HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_RUNTIME_DIR
exec = systemctl --user start hyprsunset-ramp.service
