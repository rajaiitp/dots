general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # Gruvbox Dark: muted brown (inactive) / orange accent (active)
    col.inactive_border = rgba(6c7086ff)
    col.active_border = rgba(cba6f7ff)
    layout = dwindle
    resize_on_border = true
}

dwindle {
}

decoration{
    active_opacity = 1
    inactive_opacity = 1
    # Sharp corners (was 6)
    rounding = 0
    blur{
        enabled = false
        size = 0
    }
    shadow{
        enabled = false
    }
}


windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(Authentication required)$
windowrule = float on, match:title ^(Volume Control)$
windowrule = float on, match:class ^(com\.raja\.(DisplayPopup|HyprsunsetPopup))$
