# hyprsunset — runs as a plain daemon with NO time profiles.
#
# The smooth day<->night ramp is handled by hyprsunset-ramp.py (launched from
# autostart.conf), which drives `hyprctl hyprsunset temperature` continuously
# and interpolates across a window centred on the real local sunrise/sunset.
#
# Do NOT add profile{} blocks here — they would hard-jump the temperature and
# fight the ramp script. Tune the ramp instead via env vars in the script or
# these defaults: HYPRSUNSET_DAY (5600), HYPRSUNSET_NIGHT (3700),
# HYPRSUNSET_TRANSITION_MIN (90), HYPRSUNSET_LAT/LON.
#
# A single starting profile with max-supported values keeps hyprsunset from
# applying any jump of its own; the script takes over immediately at launch.

max-gamma = 100
