# Scheduled night light. Hyprsunset changes profiles at their specified
# times; the 15-minute steps provide a gradual 19:00–21:00 sunset ramp and
# a 05:00–07:00 sunrise ramp. Daytime remains unfiltered.

# Daytime
profile {
    time = 07:00
    identity = true
}

# Sunset: 6500K → 4000K
profile {
    time = 19:00
    temperature = 6200
}
profile {
    time = 19:15
    temperature = 5900
}
profile {
    time = 19:30
    temperature = 5600
}
profile {
    time = 19:45
    temperature = 5300
}
profile {
    time = 20:00
    temperature = 5000
}
profile {
    time = 20:15
    temperature = 4700
}
profile {
    time = 20:30
    temperature = 4400
}
profile {
    time = 20:45
    temperature = 4200
}
profile {
    time = 21:00
    temperature = 4000
}

# Sunrise: 4000K → 6500K
profile {
    time = 05:00
    temperature = 4200
}
profile {
    time = 05:15
    temperature = 4400
}
profile {
    time = 05:30
    temperature = 4700
}
profile {
    time = 05:45
    temperature = 5000
}
profile {
    time = 06:00
    temperature = 5300
}
profile {
    time = 06:15
    temperature = 5600
}
profile {
    time = 06:30
    temperature = 5900
}
profile {
    time = 06:45
    temperature = 6200
}
