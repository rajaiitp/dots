# fuzzel — application launcher (Wayland-native, replaces dmenu_run)
# Layout here; COLORS come from the active theme included below.
# Switch themes with fuzzel_theme.sh (taskbar / keybind), which repoints
# themes/active.ini at one of the presets in themes/.
#
# NOTE: `include=` must sit at the top, before any [section] header.
include=~/.config/fuzzel/themes/active.ini

[main]
font=JetBrainsMono Nerd Font Mono:size=11
prompt=">   "
icon-theme=Pop
icons-enabled=yes
terminal=/home/raja/.local/bin/wezterm start --always-new-process
layer=overlay
width=45
lines=12
horizontal-pad=20
vertical-pad=16
inner-pad=8
line-height=18
fields=name,generic,comment,categories,keywords

[border]
width=2
radius=0
